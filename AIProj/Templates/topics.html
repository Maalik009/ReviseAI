
<!DOCTYPE html>
<html>
<head>
    <title>{{ subject.title }} - ReviseAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <a href="{{ url_for('subjects_page') }}">
        ← Back to Subjects
    </a>

    <h1>{{ subject.title }}</h1>

    <p>Choose a topic to start revising.</p>

    <div class="topic-list">

        {% for topic in subject.topics %}

            <div class="topic-card">

                <h2>{{ topic.title }}</h2>

                <a href="{{ url_for('topic_page',
                                    subject_id=subject.id,
                                    topic_id=topic.id) }}">
                    View Notes
                </a>

            </div>

        {% else %}

            <p>No topics found for this subject yet.</p>

        {% endfor %}

    </div>

</body>
</html>
